services:
  app:
    container_name: akalin-tech-api-container
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - akalin-tech-api-network
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '80:80'
    depends_on:
      - app
  postgres:
    container_name: akalin-tech-api-postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # Changed host port to avoid conflict with local PostgreSQL
    networks:
      - akalin-tech-api-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  akalin-tech-api-network:
    driver: bridge

volumes:
  postgres-data: